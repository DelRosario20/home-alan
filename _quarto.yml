project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "projects/*.qmd"
    - "research/*.qmd"
    - "bi/*.qmd"
    - "posts/**/*.qmd"
    - "!paper/**/*.qmd"

website:
  title: "Alan Del Rosario"
  site-url: https://delrosario20.github.io/home-alan/
  description: "Economía aplicada y análisis de datos — Ecuador"
  draft-mode: gone
  search:
    location: navbar
    type: overlay
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    pinned: false
    collapse-below: lg
    left:
      - href: index.qmd
        text: Inicio
      - href: projects/index.qmd
        text: Casos
      - href: research/index.qmd
        text: Investigación
      - href: bi/index.qmd
        text: Tableros
      - href: posts/index.qmd
        text: Notas
    right:
      - href: cv.pdf
        text: CV
      - href: about.qmd
        text: Perfil
      - icon: github
        href: https://github.com/DelRosario20
        aria-label: GitHub
      - icon: linkedin
        href: https://linkedin.com/in/alan-del-rosario-695b4423a
        aria-label: LinkedIn
  page-footer:
    left: "**Alan Del Rosario** · Economía aplicada y analítica"
    right: "Sitio estático · Hecho con [Quarto](https://quarto.org)"

format:
  html:
    theme: [cosmo, styles.scss]
    toc: true
    toc-title: "En esta página"
    lang: es
    code-copy: true
    smooth-scroll: true
    link-external-newwindow: true

execute:
  freeze: auto
